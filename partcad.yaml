desc: TowerPro parts
# Not manufacturable: the published design has overlapping parts. That is a
# known flaw in the design these models come from, not something this package
# introduced, so nothing here claims it can be built as drawn.
manufacturable: false
cover:
  assembly: example/mg90s
docs:
  name: //pub/electromechanics/towerpro

dependencies:
  pub:
    onlyInRoot: True
    type: git
    url: https://github.com/partcad/partcad-index/

parts:
  servo/mg90s:
    type: step # Courtesy of Oleksii Pryimachenko, https://grabcad.com/library/tower-pro-mg90s-micro-servo-2
    desc: MG90S digital servo
    vendor: towerpro
    sku: mg90s-3
    url: https://www.towerpro.com.tw/product/mg90s-3/
    implements:
      "//pub/std/metric/m:m2.5-threaded-hole-4":
        screw: [[5.375, 21.0, 0], [1, 0, 0], 90]
      "//pub/std/metric/m:m2.5-thru-2.5":
        top-front: [[13.75, 9.6, 0], [1, 0, 0], 90]
        top-rear: [[13.75, 7.1, 0], [1, 0, 0], -90]
        bottom-front: [[-13.75, 9.6, 0], [1, 0, 0], 90]
        bottom-rear: [[-13.75, 7.1, 0], [1, 0, 0], -90]
  servo/shoulder-unidir:
    type: step # Courtesy of Oleksii Pryimachenko, https://grabcad.com/library/tower-pro-mg90s-micro-servo-2
    desc: Unidirectional shoulder, comes with MG90S digital servo
    vendor: towerpro
    implements:
      "//pub/std/metric/m:m2.5-thru-1":
        outer-flush: [[0, 2.4, 0], [1, 0, 0], 90]
        outer: [[0, 1.5, 0], [1, 0, 0], 90]
        inner: [[0, 0.5, 0], [1, 0, 0], -90]

assemblies:
  example/mg90s:
    type: assy
    desc: An example assembly with MG90S servo
    interference:
      # The two mounting screws bear on the motor's face, and the two faces
      # meet exactly. Computed against a STEP model they come back 0.240 mm^3
      # into each other, which over an ISO 4762 M2.5 head - 4.5mm across, so
      # 15.9 mm^2 of bearing face - is 15 micrometres. That is the arithmetic
      # of two surfaces that touch, not a screw that is in the way, and it is
      # what this floor is for; the default of 0.05 mm^3 is 3 micrometres over
      # that face, which is finer than the model is.
      #
      # Only that. Everything else the check reports here is stated on the
      # joint that causes it - see the 'snapIn' and 'interferes' in
      # 'example/mg90s.assy'.
      minVolume: 0.3
render:
  svg:
  readme:
