desc: TowerPro parts
cover:
  assembly: example/mg90s
docs:
  name: //pub/electromechanics/towerpro

import:
  pub:
    onlyInRoot: True
    type: git
    url: https://github.com/partcad/partcad-index/

parts:
  servo/mg90s:
    type: step # Courtesy of Oleksii Pryimachenko, https://grabcad.com/library/tower-pro-mg90s-micro-servo-2
    desc: MG90S digital servo
    vendor: towerpro
    sku: mg90s-3
    url: https://www.towerpro.com.tw/product/mg90s-3/
    implements:
      "//pub/std/metric/m:m2.5-threaded-hole-4":
        screw: [[5.375, 21.0, 0], [1, 0, 0], 90]
      "//pub/std/metric/m:m2.5-thru-2.5":
        top-front: [[13.75, 9.6, 0], [1, 0, 0], 90]
        top-rear: [[13.75, 7.1, 0], [1, 0, 0], -90]
        bottom-front: [[-13.75, 9.6, 0], [1, 0, 0], 90]
        bottom-rear: [[-13.75, 7.1, 0], [1, 0, 0], -90]
  servo/shoulder-unidir:
    type: step # Courtesy of Oleksii Pryimachenko, https://grabcad.com/library/tower-pro-mg90s-micro-servo-2
    desc: Unidirectional shoulder, comes with MG90S digital servo
    vendor: towerpro
    implements:
      "//pub/std/metric/m:m2.5-thru-1":
        outer-flush: [[0, 2.4, 0], [1, 0, 0], 90]
        outer: [[0, 1.5, 0], [1, 0, 0], 90]
        inner: [[0, 0.5, 0], [1, 0, 0], -90]

assemblies:
  example/mg90s:
    type: assy
    desc: An example assembly with MG90S servo
    interference:
      # Two pairs that are meant to touch, and do so in solid rather than in
      # the springs and chamfers a STEP model does not carry.
      #
      #  * the horn is pushed onto the splined output boss - an interference
      #    fit is what holds a servo horn on, so the two share the material the
      #    splines bite into (2.922 mm^3);
      #  * the countersunk screw beds into the horn, whose hole is modelled as
      #    a plain 1mm through hole with no countersink to receive the cone
      #    (1.627 mm^3).
      #
      # Both have always been here; they became visible when
      # 'partcad.test.interference' stopped passing on its own failure
      # (partcad/partcad#630). Neither is placement that can be corrected -
      # 'moveZ' on these interfaces has no range to move along, so the screw
      # cannot be seated any shallower.
      ignore:
        - [shoulder, motor]
        - [shoulder, screw-horn]

render:
  svg:
  readme:
